<!DOCTYPE html>
<html lang="en" xmlns:th = "https://www.thymeleaf.org/">

<head th:replace="fragments :: header"></head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <ul th:replace="fragments::slidebar"></ul>
        <!-- End of Sidebar -->

        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav th:replace="fragments::topbar"></nav>
                <!-- End of Topbar -->
                <div class="container-fluid">
                    <form class="form-horizontal" th:action="@{/update-product/{id} (id=${productDto.id})}" method="post" th:object = "${productDto}"
                          enctype="multipart/form-data">
                        <fieldset>

                            <!-- Form Name -->
                            <legend>Update Products</legend>


                            <!-- Text input-->
                            <div class="form-group">
                                <label class="col-md-4 control-label" for="name">PRODUCT NAME</label>
                                <div class="col-md-4">
                                    <input id="name" name="name" th:field="*{name}" type="text">

                                </div>
                            </div>
                            <!-- Select Basic -->
                            <div class="form-group">
                                <label class="col-md-4 control-label" for="categories">PRODUCT CATEGORY</label>
                                <div class="col-md-4">
                                    <select id="categories" name="categories"  th:field="*{category}" class="form-control">
                                        <option th:value="null">--SELECT--</option>
                                        <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"
                                        ></option>
                                    </select>
                                </div>
                            </div>
                            <!-- Text input-->
                            <div class="form-group">
                                <label class="col-md-4 control-label" for="description">PRODUCT DESCRIPTION</label>
                                <div class="col-md-4">
                                    <input id="description" name="description" class="form-control input-md" th:field="*{description}" required="" type="text">

                                </div>
                            </div>



                            <!-- Text input-->
                            <div class="form-group">
                                <label class="col-md-4 control-label" for="available_quantity">AVAILABLE QUANTITY</label>
                                <div class="col-md-4">
                                    <input id="available_quantity" name="available_quantity" th:field="*{currentQuantity}" class="form-control input-md" required="" type="text">

                                </div>
                            </div>



                            <!-- Text input-->
                            <div class="form-group">
                                <label class="col-md-4 control-label" for="price">Price</label>
                                <div class="col-md-4">
                                    <input id="price" name="price" class="form-control input-md" th:field="*{costPrice}" required="" type="text">

                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-md-4 control-label" for="price">Sale price</label>
                                <div class="col-md-4">
                                    <input id="salePrice" name="salePrice" class="form-control input-md" th:field="*{salePrice}" required="" type="text">

                                </div>
                            </div>

                            <!-- Text input-->
                            <div class="form-group">
                                <div class="col-md-4">

                                    <!-- File Button -->
                                    <div class="form-group">
                                        <label class="col-md-4 control-label" for="imageProduct">Product Image</label>
                                        <img class = "my-product-image" style="height: 40px; width: 40px;" alt=""
                                             th:src="'data:image/jpeg;base64,' + ${productDto.image}">
                                        <div class="col-md-4">
                                            <input id="imageProduct" name="imageProduct" class="input-file" type="file">
                                        </div>
                                    </div>
                                </div>
                            </div>



                        </fieldset>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>

                </div>



            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer th:replace="fragments::footer"></footer>
            <!-- End of Footer -->

        </div>


    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a th:replace="fragments :: scroll"></a>

    <!-- Logout Modal-->
    <div th:replace="fragments :: logout"></div>




<!--change name edit-->

<!--change name edit-->

    <div th:replace="fragments :: script"></div>
</body>

</html>
