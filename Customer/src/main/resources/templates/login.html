<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<!-- Added by HTTrack --><meta http-equiv="content-type" content="text/html;charset=UTF-8" /><!-- /Added by HTTrack -->
<head th:replace="fragments::head"></head>

<body>
    <div class="page-wrapper">
        <header th:replace="fragments::header"></header><!-- End .header -->

        <main class="main">


            <div class="login-page bg-image pt-8 pb-8 pt-md-12 pb-md-12 pt-lg-17 pb-lg-17" style="background-image: url('images/backgrounds/img.png')">
            	<div class="container">
            		<div class="form-box">
            			<div class="form-tab">
	            			<ul class="nav nav-pills nav-fill" role="tablist">
                                <li class="nav-item">
                                    <a class="nav-link" id="signin-tab-2" data-toggle="tab" href="#signin-2" role="tab" aria-controls="signin-2" aria-selected="false">Log In</a>
                                </li>
							</ul>
                            <div th:if = "${param.error}" class="text-center alert alert-warning">
                                <p>Invalid username or password</p>
                            </div>

                            <div th:if = "${param.logout}" class="text-center alert alert-success">
                                <p>You have been logged out</p>
                            </div>
                            <form th:action="@{/do-login}" method="post">
                                <div class="form-group">
                                    <label >Username or email address *</label>
                                    <input type="text" name="username" class="form-control">
                                </div><!-- End .form-group -->

                                <div class="form-group">
                                    <label >Password *</label>
                                    <input type="password" name="password" class="form-control">
                                </div><!-- End .form-group -->

                                <div class="form-footer">
                                    <button type="submit" class="btn btn-outline-primary-2">
                                        <span>LOG IN</span>
                                        <i class="icon-long-arrow-right"></i>
                                    </button>



                                    <a th:href="@{/register}">REGISTER</a>
                                </div><!-- End .form-footer -->
                            </form>
						</div><!-- End .form-tab -->
            		</div><!-- End .form-box -->
            	</div><!-- End .container -->
            </div><!-- End .login-page section-bg -->
        </main><!-- End .main -->

        <footer th:replace="fragments::footer"></footer>
    </div><!-- End .page-wrapper -->


    <!-- Plugins JS File -->
    <script th:replace="fragments::script"></script>
</body>
